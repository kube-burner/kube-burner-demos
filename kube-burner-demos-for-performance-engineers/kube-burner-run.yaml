---
global:
  measurements:
    - name: pprof
      pprofInterval: 30s
      pprofDirectory: ./profiles
      pprofTargets:
        - name: pprof-demo-cpu
          namespace: pprof-demo
          labelSelector:
            app: pprof-demo
          url: http://127.0.0.1:8080/debug/pprof/profile?seconds=30
        - name: pprof-demo-heap
          namespace: pprof-demo
          labelSelector:
            app: pprof-demo
          url: http://127.0.0.1:8080/debug/pprof/heap
jobs:
  - name: noop
    jobIterations: 1
    jobType: read
    namespace: pprof-demo
    waitWhenFinished: true
    podWait: false
